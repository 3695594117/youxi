<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>逃杀·狩灵·灭魔</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a2f1f;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', 'Microsoft Yahei', system-ui, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* 全屏游戏画布 */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #2a5e2a;
            cursor: crosshair;
        }

        /* 小地图容器 (点击缩放/标记) */
        .minimap-wrapper {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 160px;
            height: 160px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #ffd966;
            z-index: 30;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
        }
        .minimap-wrapper:active {
            transform: scale(0.97);
        }
        #minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
        }
        .minimap-label {
            position: absolute;
            bottom: 2px;
            left: 5px;
            font-size: 9px;
            background: #000000aa;
            color: #ffec9f;
            border-radius: 10px;
            padding: 1px 6px;
            pointer-events: none;
        }

        /* 虚拟按钮区域 (手机/PC 通用) */
        .controls {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 40;
            pointer-events: none;
        }
        .btn-group {
            pointer-events: auto;
            display: flex;
            gap: 18px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #ffd96680;
        }
        .action-btn {
            background: #ffcc44;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 65px;
            font-size: 28px;
            font-weight: bold;
            color: #2c1e0a;
            box-shadow: 0 6px 0 #b47c00;
            transition: 0.05s linear;
            cursor: pointer;
            touch-action: manipulation;
            font-family: monospace;
        }
        .action-btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #b47c00;
        }
        .skill-btn {
            background: #6a4eff;
            color: white;
            box-shadow: 0 6px 0 #2f1c8a;
        }
        .hp-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #1e1a0ccc;
            backdrop-filter: blur(6px);
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffd966;
            font-weight: bold;
            font-size: 14px;
            z-index: 30;
            border-left: 4px solid #ffaa33;
        }
        .quest-info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000aa;
            backdrop-filter: blur(6px);
            padding: 6px 18px;
            border-radius: 80px;
            color: #f5e2b0;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
            z-index: 30;
            font-family: monospace;
        }
        @media (max-width: 700px) {
            .action-btn { width: 55px; height: 55px; font-size: 24px; }
            .btn-group { gap: 12px; padding: 6px 16px; }
            .minimap-wrapper { width: 130px; height: 130px; top: 10px; right: 10px; }
            .hp-bar { font-size: 12px; top: 8px; left: 8px; }
            .quest-info { font-size: 12px; top: 8px; white-space: nowrap; }
        }
        .cd-overlay {
            position: fixed;
            bottom: 95px;
            left: 20px;
            background: #00000099;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
            color: #ffbb66;
            pointer-events: none;
            z-index: 45;
            font-weight: bold;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- 小地图 单击缩放+标记预览 -->
<div class="minimap-wrapper" id="minimapWrap">
    <canvas id="minimapCanvas" width="300" height="300"></canvas>
    <div class="minimap-label">🗺️ 点击缩放 | 红=怪 | 紫=Boss</div>
</div>

<div class="hp-bar">❤️ 生命值: <span id="hpValue">100</span> | ⚔️ 连发模式: <span id="modeStatus">普通</span></div>
<div class="quest-info">🚪 逃生条件: 击杀 小怪(<span id="mobKill">0</span>/5) 或 击杀 BOSS(0/1)</div>
<div class="cd-overlay" id="cdInfo">🔫 普攻冷却: 就绪</div>

<div class="controls">
    <div class="btn-group">
        <button class="action-btn" id="attackBtn">🗡️ 攻</button>
        <button class="action-btn skill-btn" id="ultraBtn">✨ Q连发</button>
    </div>
</div>

<script>
    (function(){
        // ---------- 世界配置 ----------
        const MAP_W = 3200;
        const MAP_H = 2400;
        const PLAYER_RADIUS = 32;
        
        // 游戏状态
        let player = {
            x: MAP_W/2,
            y: MAP_H/2,
            hp: 100,
            maxHp: 100,
            invincible: 0
        };
        let enemies = [];      // 普通小怪 {x,y, hp, radius, speed, type}
        let boss = null;       // 特殊boss
        let projectiles = [];   // 子弹 {"桂英"}
        
        let normalKills = 0;
        let bossDefeated = false;
        let gameActive = true;
        let winFlag = false;
        
        // 冷却机制
        let normalCd = 0;       // 0.3秒冷却 (帧率约60, 冷却帧数18帧)
        let ultraActive = false; // Q连发模式(无冷却)
        let ultraDuration = 0;   // 连发剩余持续时间(帧)
        
        // 追杀者图片替换为新的怪物图片(小怪/boss共用新图)
        const monsterImg = new Image();
        monsterImg.crossOrigin = "Anonymous";
        monsterImg.src = "https://t.tutu.to/img/Lyj86";
        let monsterReady = false;
        monsterImg.onload = () => monsterReady = true;
        
        // 相机 (跟随玩家)
        let camera = { x: 0, y: 0 };
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        
        // 小地图相关
        let minimapZoom = 1.0;
        let minimapCanvas = document.getElementById('minimapCanvas');
        let mmCtx = minimapCanvas.getContext('2d');
        
        // 树木/障碍物 (装饰)
        let trees = [];
        const TREE_COUNT = 70;
        
        // ---------- 初始化世界 ----------
        function initWorld() {
            // 生成树木
            trees = [];
            for(let i=0;i<TREE_COUNT;i++){
                let tx = 100 + Math.random() * (MAP_W-200);
                let ty = 100 + Math.random() * (MAP_H-200);
                trees.push({x:tx, y:ty});
            }
            // 生成小怪 5只 (100血)
            enemies = [];
            for(let i=0;i<5;i++){
                let angle = Math.random() * Math.PI*2;
                let radius = 500 + Math.random() * 400;
                let ex = player.x + Math.cos(angle)*radius;
                let ey = player.y + Math.sin(angle)*radius;
                ex = Math.min(Math.max(ex, 60), MAP_W-60);
                ey = Math.min(Math.max(ey, 60), MAP_H-60);
                enemies.push({
                    x: ex, y: ey, hp: 100, maxHp:100,
                    radius: 28, speed: 1.0, type: "mob"
                });
            }
            // 生成Boss (1000血) 位于远处
            let bx = player.x + (Math.random()>0.5? 800 : -800);
            let by = player.y + (Math.random()>0.5? 600 : -600);
            bx = Math.min(Math.max(bx, 150), MAP_W-150);
            by = Math.min(Math.max(by, 150), MAP_H-150);
            boss = {
                x: bx, y: by, hp: 1000, maxHp:1000,
                radius: 48, speed: 1.3, type: "boss"
            };
            normalKills = 0;
            bossDefeated = false;
            gameActive = true;
            winFlag = false;
            player.hp = player.maxHp;
            player.invincible = 0;
            ultraActive = false;
            ultraDuration = 0;
            normalCd = 0;
            updateUI();
        }
        
        // 小怪AI移动 (缓慢追逐玩家)
        function updateEnemies() {
            for(let i=0;i<enemies.length;i++){
                let e = enemies[i];
                let dx = player.x - e.x;
                let dy = player.y - e.y;
                let len = Math.hypot(dx,dy);
                if(len > 0.5){
                    let step = Math.min(e.speed, len-8);
                    e.x += (dx/len)*step;
                    e.y += (dy/len)*step;
                }
                // 边界
                e.x = Math.min(Math.max(e.x, e.radius), MAP_W - e.radius);
                e.y = Math.min(Math.max(e.y, e.radius), MAP_H - e.radius);
            }
            if(boss && !bossDefeated){
                let dx = player.x - boss.x;
                let dy = player.y - boss.y;
                let len = Math.hypot(dx,dy);
                if(len > 0.5){
                    let step = Math.min(boss.speed, len-15);
                    boss.x += (dx/len)*step;
                    boss.y += (dy/len)*step;
                }
                boss.x = Math.min(Math.max(boss.x, boss.radius), MAP_W - boss.radius);
                boss.y = Math.min(Math.max(boss.y, boss.radius), MAP_H - boss.radius);
            }
        }
        
        // 子弹自动索敌 (发射桂英文字)
        function shoot(targetX, targetY){
            if(!gameActive) return false;
            let closest = null;
            let minDist = 500;
            // 优先锁 boss
            if(boss && !bossDefeated){
                let db = Math.hypot(boss.x - targetX, boss.y - targetY);
                if(db < minDist){ minDist = db; closest = boss; }
            }
            for(let e of enemies){
                let d = Math.hypot(e.x - targetX, e.y - targetY);
                if(d < minDist){ minDist = d; closest = e; }
            }
            if(!closest) return false;
            projectiles.push({
                x: player.x, y: player.y,
                target: closest,
                damage: 25,
                speed: 12,
                life: true,
                text: "桂英"
            });
            return true;
        }
        
        // 更新子弹
        function updateProjectiles(){
            for(let i=0;i<projectiles.length;i++){
                let p = projectiles[i];
                if(!p.target || (p.target.hp <= 0) || (p.target.type==="boss" && bossDefeated)){
                    projectiles.splice(i,1); i--; continue;
                }
                let dx = p.target.x - p.x;
                let dy = p.target.y - p.y;
                let len = Math.hypot(dx,dy);
                if(len < 12){
                    // 命中
                    p.target.hp -= p.damage;
                    if(p.target.hp <= 0){
                        if(p.target.type === "mob"){
                            normalKills++;
                            let idx = enemies.indexOf(p.target);
                            if(idx !== -1) enemies.splice(idx,1);
                        } else if(p.target.type === "boss"){
                            bossDefeated = true;
                            boss = null;
                        }
                    }
                    projectiles.splice(i,1); i--;
                    updateUI();
                } else {
                    let step = Math.min(p.speed, len);
                    p.x += (dx/len)*step;
                    p.y += (dy/len)*step;
                }
            }
        }
        
        // 玩家受击 & 无敌
        function checkPlayerHurt(){
            if(player.invincible > 0){
                player.invincible--;
                return;
            }
            for(let e of enemies){
                let dist = Math.hypot(player.x - e.x, player.y - e.y);
                if(dist < PLAYER_RADIUS + e.radius){
                    player.hp -= 12;
                    player.invincible = 18;
                    if(player.hp <= 0){ gameActive=false; winFlag=false; alert("游戏失败，点击刷新重新挑战"); location.reload(); }
                    break;
                }
            }
            if(boss && !bossDefeated){
                let dist = Math.hypot(player.x - boss.x, player.y - boss.y);
                if(dist < PLAYER_RADIUS + boss.radius){
                    player.hp -= 25;
                    player.invincible = 18;
                    if(player.hp <= 0){ gameActive=false; alert("被BOSS击败"); location.reload(); }
                }
            }
            updateUI();
        }
        
        // 胜利条件: 5小怪 或 boss死亡
        function checkWin(){
            if(!gameActive) return;
            let win = false;
            if(normalKills >= 5) win = true;
            if(bossDefeated) win = true;
            if(win){
                gameActive = false;
                winFlag = true;
                alert("✨ 胜利！ 你已逃离噩梦森林 ✨\n点击确定重新开始");
                location.reload();
            }
        }
        
        // 普通攻击(冷却处理)
        function normalAttack(){
            if(!gameActive) return;
            if(ultraActive){
                // 连发模式无冷却，直接发射
                let angle = Math.atan2(player.y - (boss?boss.y: (enemies[0]?.y||player.y)), player.x - (boss?boss.x: (enemies[0]?.x||player.x)));
                let targetX = player.x - Math.cos(angle)*80;
                let targetY = player.y - Math.sin(angle)*80;
                shoot(targetX, targetY);
            } else {
                if(normalCd <= 0){
                    let angle = Math.atan2(player.y - (boss?boss.y: (enemies[0]?.y||player.y)), player.x - (boss?boss.x: (enemies[0]?.x||player.x)));
                    let targetX = player.x - Math.cos(angle)*80;
                    let targetY = player.y - Math.sin(angle)*80;
                    if(shoot(targetX, targetY)){
                        normalCd = 18; // 0.3秒 (60帧->18帧)
                    }
                }
            }
        }
        
        // 开启大招(连发)
        function activateUltra(){
            if(!gameActive) return;
            ultraActive = true;
            ultraDuration = 300; // 5秒连发
            document.getElementById('modeStatus').innerText = "连发⚡";
            setTimeout(()=>{
                if(ultraActive){
                    ultraActive = false;
                    document.getElementById('modeStatus').innerText = "普通";
                }
            }, 5000);
        }
        
        // 更新UI
        function updateUI(){
            document.getElementById('hpValue').innerText = player.hp;
            document.getElementById('mobKill').innerText = normalKills;
            let cdSpan = document.getElementById('cdInfo');
            if(!ultraActive && normalCd>0){
                cdSpan.innerText = `⏳ 普攻冷却: ${Math.ceil(normalCd/6)/10}s`;
            } else if(ultraActive){
                cdSpan.innerText = `🔥 连发模式 剩余 ${Math.ceil(ultraDuration/6)/10}s`;
            } else {
                cdSpan.innerText = `🔫 普攻冷却: 就绪`;
            }
        }
        
        // 帧更新冷却
        function updateCooldown(){
            if(normalCd > 0) normalCd--;
            if(ultraActive){
                ultraDuration--;
                if(ultraDuration <= 0){
                    ultraActive = false;
                    document.getElementById('modeStatus').innerText = "普通";
                }
            }
            updateUI();
        }
        
        // 相机跟随玩家 (中心)
        function updateCamera(){
            let targetX = player.x - canvas.width/2;
            let targetY = player.y - canvas.height/2;
            targetX = Math.min(Math.max(targetX, 0), MAP_W - canvas.width);
            targetY = Math.min(Math.max(targetY, 0), MAP_H - canvas.height);
            camera.x += (targetX - camera.x) * 0.12;
            camera.y += (targetY - camera.y) * 0.12;
            camera.x = Math.min(Math.max(camera.x, 0), MAP_W - canvas.width);
            camera.y = Math.min(Math.max(camera.y, 0), MAP_H - canvas.height);
        }
        
        // ---------- 绘图(所有视觉) ----------
        function drawBackground(){
            ctx.fillStyle = '#346b34';
            ctx.fillRect(0,0,canvas.width,canvas.height);
            for(let t of trees){
                let sx = t.x - camera.x;
                let sy = t.y - camera.y;
                if(sx > -80 && sx < canvas.width+80){
                    ctx.fillStyle = '#5c8c44';
                    ctx.fillRect(sx-10, sy-15, 20, 30);
                    ctx.fillStyle = '#47632c';
                    ctx.beginPath();
                    ctx.arc(sx, sy-18, 15, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        
        function drawEnemies(){
            for(let e of enemies){
                let sx = e.x - camera.x;
                let sy = e.y - camera.y;
                if(sx > -100 && sx < canvas.width+100){
                    if(monsterReady) ctx.drawImage(monsterImg, sx-28, sy-28, 56,56);
                    else ctx.fillStyle='#b33e3e', ctx.beginPath(), ctx.arc(sx,sy,26,0,Math.PI*2), ctx.fill();
                    ctx.fillStyle='#fff2b0';
                    ctx.font='bold 18px monospace';
                    ctx.fillText(`❤️ ${e.hp}`, sx-22, sy-30);
                }
            }
            if(boss && !bossDefeated){
                let sx = boss.x - camera.x;
                let sy = boss.y - camera.y;
                if(monsterReady) ctx.drawImage(monsterImg, sx-44, sy-44, 88,88);
                else ctx.fillStyle='#8f2f6f', ctx.beginPath(), ctx.arc(sx,sy,44,0,Math.PI*2), ctx.fill();
                ctx.fillStyle='#ffbc6e';
                ctx.font='bold 20px monospace';
                ctx.fillText(`👾 BOSS ${boss.hp}`, sx-44, sy-52);
            }
        }
        
        function drawProjectiles(){
            for(let p of projectiles){
                let sx = p.x - camera.x;
                let sy = p.y - camera.y;
                ctx.fillStyle = '#ffec80';
                ctx.font = 'bold 22px "KaiTi","楷体"';
                ctx.shadowBlur = 6;
                ctx.fillText("桂英", sx-15, sy-8);
                ctx.shadowBlur = 0;
            }
        }
        
        function drawPlayer(){
            let sx = player.x - camera.x;
            let sy = player.y - camera.y;
            ctx.font = '52px "Segoe UI Emoji"';
            ctx.fillStyle = '#ffffb0';
            ctx.fillText("🙂", sx-24, sy+16);
            ctx.font = 'bold 22px system-ui';
            ctx.fillStyle = '#fcd15a';
            ctx.fillText("⚔️", sx-12, sy-18);
            // 血条
            let percent = player.hp/player.maxHp;
            ctx.fillStyle = '#aa2222';
            ctx.fillRect(sx-30, sy-42, 60, 8);
            ctx.fillStyle = '#44ff44';
            ctx.fillRect(sx-30, sy-42, 60*percent, 8);
        }
        
        // 小地图 (单击缩放, 自动标记)
        function drawMinimap(){
            const w = minimapCanvas.width, h = minimapCanvas.height;
            mmCtx.clearRect(0,0,w,h);
            mmCtx.fillStyle = '#2d4827';
            mmCtx.fillRect(0,0,w,h);
            let zoom = minimapZoom;
            let centerX = w/2, centerY = h/2;
            let trans = (wx,wy) => {
                let rx = (wx - MAP_W/2) * zoom + centerX;
                let ry = (wy - MAP_H/2) * zoom + centerY;
                return {x: rx, y: ry};
            };
            // 树木灰点
            mmCtx.fillStyle = '#7fa86a';
            for(let t of trees){
                let p = trans(t.x,t.y);
                if(p.x>0 && p.x<w && p.y>0 && p.y<h) mmCtx.fillRect(p.x-1.5,p.y-1.5,3,3);
            }
            // 小怪红点
            for(let e of enemies){
                let p = trans(e.x,e.y);
                mmCtx.beginPath();
                mmCtx.fillStyle = '#e34234';
                mmCtx.arc(p.x,p.y,5,0,Math.PI*2);
                mmCtx.fill();
            }
            if(boss && !bossDefeated){
                let p = trans(boss.x,boss.y);
                mmCtx.fillStyle = '#bf4c8f';
                mmCtx.beginPath();
                mmCtx.arc(p.x,p.y,8,0,Math.PI*2);
                mmCtx.fill();
                mmCtx.fillStyle = 'white';
                mmCtx.font = 'bold 14px monospace';
                mmCtx.fillText("⚠️", p.x-6, p.y+4);
            }
            // 玩家绿三角
            let pp = trans(player.x,player.y);
            mmCtx.fillStyle = '#55ff77';
            mmCtx.beginPath();
            mmCtx.moveTo(pp.x, pp.y-8);
            mmCtx.lineTo(pp.x-6, pp.y+4);
            mmCtx.lineTo(pp.x+6, pp.y+4);
            mmCtx.fill();
            // 视野框
            let tl = trans(camera.x, camera.y);
            let br = trans(camera.x+canvas.width, camera.y+canvas.height);
            mmCtx.strokeStyle = '#ffdd99';
            mmCtx.lineWidth = 1.5;
            mmCtx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
        }
        
        // 缩放小地图点击事件
        function toggleMinimapZoom(){
            minimapZoom = (minimapZoom === 1.0) ? 1.8 : 1.0;
            drawMinimap();
        }
        
        // 画布自适应
        function resizeCanvas(){
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            drawAll();
        }
        
        function drawAll(){
            if(!ctx) return;
            drawBackground();
            drawEnemies();
            drawProjectiles();
            drawPlayer();
            drawMinimap();
        }
        
        // 游戏循环
        let lastTimestamp = 0;
        function gameUpdate(){
            if(gameActive){
                updateEnemies();
                updateProjectiles();
                checkPlayerHurt();
                updateCooldown();
                updateCamera();
                checkWin();
                drawAll();
            } else {
                drawAll();
            }
            requestAnimationFrame(gameUpdate);
        }
        
        // 自动索敌攻击辅助(用于按钮)
        function attackWrapper(){
            if(!gameActive) return;
            normalAttack();
        }
        
        // 事件绑定 + 移动摇杆模拟 (点击拖拽移动玩家)
        let isMoving = false;
        let moveTarget = {x: player.x, y: player.y};
        
        function getCanvasCoord(e){
            let rect = canvas.getBoundingClientRect();
            let scaleX = canvas.width / rect.width;
            let scaleY = canvas.height / rect.height;
            let cx, cy;
            if(e.touches){
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            let canvasX = (cx - rect.left) * scaleX;
            let canvasY = (cy - rect.top) * scaleY;
            return {x: Math.min(Math.max(canvasX,0), canvas.width), y: Math.min(Math.max(canvasY,0), canvas.height)};
        }
        
        function onPointerDown(e){
            e.preventDefault();
            let coord = getCanvasCoord(e);
            let worldX = coord.x + camera.x;
            let worldY = coord.y + camera.y;
            moveTarget = {x: worldX, y: worldY};
            isMoving = true;
        }
        function onPointerMove(e){
            if(!isMoving) return;
            let coord = getCanvasCoord(e);
            let worldX = coord.x + camera.x;
            let worldY = coord.y + camera.y;
            moveTarget = {x: worldX, y: worldY};
        }
        function onPointerUp(){
            isMoving = false;
        }
        function updatePlayerMove(){
            if(!gameActive) return;
            if(isMoving){
                let dx = moveTarget.x - player.x;
                let dy = moveTarget.y - player.y;
                let len = Math.hypot(dx,dy);
                let step = 7.2;
                if(len < step){
                    player.x = moveTarget.x;
                    player.y = moveTarget.y;
                } else {
                    player.x += (dx/len)*step;
                    player.y += (dy/len)*step;
                }
                player.x = Math.min(Math.max(player.x, PLAYER_RADIUS), MAP_W - PLAYER_RADIUS);
                player.y = Math.min(Math.max(player.y, PLAYER_RADIUS), MAP_H - PLAYER_RADIUS);
            }
        }
        
        // 主动帧移动
        function movementLoop(){
            updatePlayerMove();
            requestAnimationFrame(movementLoop);
        }
        
        // 启动
        window.addEventListener('resize', ()=>{ resizeCanvas(); drawMinimap(); });
        document.getElementById('attackBtn').addEventListener('click', attackWrapper);
        document.getElementById('ultraBtn').addEventListener('click', ()=>{ if(gameActive) activateUltra(); });
        document.getElementById('minimapWrap').addEventListener('click', toggleMinimapZoom);
        
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive:false});
        window.addEventListener('touchmove', onPointerMove, {passive:false});
        window.addEventListener('touchend', onPointerUp);
        
        initWorld();
        resizeCanvas();
        gameUpdate();
        movementLoop();
        setInterval(()=>{ if(gameActive) drawMinimap(); }, 100);
    })();
</script>
</body>
</html>
