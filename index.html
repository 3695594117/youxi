<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>狩灵神殿·大逃杀 | 钥匙&门机制</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: #0a2f1f;
            overflow: hidden;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        /* ========= 启动视频全屏样式 ========= */
        .intro-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background: #000;
        }
        .skip-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(0,0,0,0.6);
            color: #ffd966;
            border: 1px solid #ffd966;
            padding: 8px 20px;
            border-radius: 40px;
            font-family: system-ui;
            font-size: 14px;
            cursor: pointer;
            z-index: 1001;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .skip-btn:hover {
            background: #ffd966;
            color: #1a1a2a;
        }
        
        /* ========= 游戏内容样式 ========= */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background: #2a5e2a;
            cursor: crosshair;
        }
        .minimap-wrapper {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 200px;
            height: 200px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            border: 2px solid #ffd966;
            z-index: 30;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .minimap-wrapper.full {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 85vw;
            max-width: 550px;
            max-height: 550px;
            border-radius: 28px;
            z-index: 200;
            border: 3px solid #ffaa44;
        }
        #minimapCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: pointer;
            background-color: #2d4827;
        }
        .minimap-label {
            position: absolute;
            bottom: 2px;
            left: 5px;
            font-size: 9px;
            background: #000000aa;
            color: #ffec9f;
            border-radius: 10px;
            padding: 1px 6px;
            pointer-events: none;
        }
        .hp-bar {
            position: fixed;
            top: 15px;
            left: 15px;
            background: #1e1a0ccc;
            backdrop-filter: blur(6px);
            padding: 6px 14px;
            border-radius: 40px;
            color: #ffd966;
            font-weight: bold;
            font-size: 14px;
            z-index: 30;
            border-left: 4px solid #ffaa33;
        }
        .quest-info {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #000000aa;
            backdrop-filter: blur(6px);
            padding: 5px 18px;
            border-radius: 80px;
            color: #f5e2b0;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
            z-index: 30;
        }
        .key-status {
            position: fixed;
            top: 60px;
            left: 15px;
            background: #000000aa;
            backdrop-filter: blur(6px);
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            color: #ffcc88;
            z-index: 30;
            font-weight: bold;
        }
        .ult-bar {
            position: fixed;
            bottom: 95px;
            left: 20px;
            width: 150px;
            background: #2c2c2c;
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            z-index: 45;
        }
        .ult-fill {
            width: 0%;
            height: 100%;
            background: #ffaa44;
            transition: width 0.05s linear;
        }
        .ult-text {
            position: fixed;
            bottom: 108px;
            left: 24px;
            font-size: 10px;
            color: #ffdd99;
            font-weight: bold;
            background: #000000aa;
            padding: 2px 8px;
            border-radius: 20px;
            z-index: 46;
        }
        .joystick-container {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 130px;
            height: 130px;
            border-radius: 130px;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(12px);
            border: 2px solid #ffd966aa;
            z-index: 50;
            touch-action: none;
        }
        .joystick-thumb {
            position: absolute;
            width: 55px;
            height: 55px;
            background: #ffd966dd;
            border-radius: 55px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 0 3px #ffaa33;
            pointer-events: none;
        }
        .btn-group {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 80px;
            z-index: 50;
        }
        .action-btn {
            background: #ffcc44;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 65px;
            font-size: 28px;
            font-weight: bold;
            color: #2c1e0a;
            box-shadow: 0 5px 0 #b47c00;
            transition: 0.05s linear;
            cursor: pointer;
        }
        .action-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b47c00; }
        .skill-btn { background: #6a4eff; color: white; box-shadow: 0 5px 0 #2f1c8a; }
        .pc-hint {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000000aa;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 11px;
            color: #ccc;
            pointer-events: none;
            z-index: 60;
        }
        @media (max-width: 700px) {
            .action-btn { width: 55px; height: 55px; font-size: 24px; }
            .joystick-container { width: 110px; height: 110px; }
            .minimap-wrapper { width: 140px; height: 140px; }
            .key-status { font-size: 10px; top: 55px; }
        }
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .menu-card {
            background: #1e2b1c;
            border-radius: 56px;
            padding: 32px 28px;
            text-align: center;
            width: 300px;
            border: 3px solid #ffd966;
        }
        .game-title { font-size: 38px; font-weight: 800; color: #ffd966; margin-bottom: 25px; }
        .menu-buttons { display: flex; flex-direction: column; gap: 15px; margin-bottom: 25px; }
        .menu-btn {
            background: #d4a017;
            border: none;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 10px 0;
            border-radius: 60px;
            color: #2c2c1c;
            cursor: pointer;
            box-shadow: 0 4px 0 #6b3c00;
        }
        .difficulty-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 15px 0;
        }
        .diff-btn {
            background: #3a4a2a;
            border: 1px solid #ffd966;
            padding: 6px 24px;
            border-radius: 40px;
            font-weight: bold;
            color: #f5e2b0;
            cursor: pointer;
        }
        .diff-btn.active { background: #ffd966; color: #1f3a1a; border-color: white; }
        .exit-btn { background: #6a2e2e; color: #ffc6a0; box-shadow: 0 4px 0 #3e1a1a; }
        
        /* 游戏容器初始隐藏 */
        .game-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>

<!-- ========= 全屏启动视频 ========= -->
<video id="introVideo" class="intro-video" autoplay muted playsinline preload="auto">
    <source src="https://raw.githubusercontent.com/3695594117/safaf/main/aaa.mp4" type="video/mp4">
    您的浏览器不支持视频播放
</video>
<button class="skip-btn" id="skipBtn">⏩ 跳过动画</button>

<!-- ========= 游戏主容器 ========= -->
<div id="gameContainer" class="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="minimap-wrapper" id="minimapWrapper">
        <canvas id="minimapCanvas" width="300" height="300"></canvas>
        <div class="minimap-label">🗺️ 全图雷达 | 点击缩放/标记</div>
    </div>

    <div class="hp-bar">❤️ <span id="hpValue">100</span> / 100</div>
    <div class="quest-info">🏆 胜利条件: 击杀小怪(<span id="mobKill">0</span>/20) 获得钥匙 → 触碰光门</div>
    <div class="key-status" id="keyStatus">🔑 钥匙: 未获得</div>
    <div class="ult-bar"><div class="ult-fill" id="ultFill"></div></div>
    <div class="ult-text" id="ultLabel">✨ 大招就绪</div>

    <div class="joystick-container" id="joystickContainer">
        <div class="joystick-thumb" id="joystickThumb"></div>
    </div>

    <div class="btn-group">
        <button class="action-btn" id="attackBtn">🗡️</button>
        <button class="action-btn skill-btn" id="ultraBtn">✨</button>
    </div>
    <div class="pc-hint">🖱️ 鼠标瞄准 | E/Q攻击/大招 | M 地图 | 地图点击标记</div>

    <div id="lobbyOverlay" class="menu-overlay">
        <div class="menu-card">
            <div class="game-title">🔪 狩灵神殿 🔪</div>
            <div class="menu-buttons">
                <button id="startGameBtn" class="menu-btn">⚔️ 开始游戏 ⚔️</button>
                <button id="exitGameBtn" class="menu-btn exit-btn">🚪 退出游戏</button>
            </div>
            <div style="color:#ffdfaa;">⚡ 难度 ⚡</div>
            <div class="difficulty-row">
                <button data-diff="low" class="diff-btn active">🐾 低</button>
                <button data-diff="medium" class="diff-btn">⚡ 中</button>
                <button data-diff="high" class="diff-btn">🔥 高</button>
            </div>
            <p style="font-size: 11px; margin-top: 18px;">👆 左摇杆移动 | 击败20小怪获得钥匙 → 触碰光门</p>
        </div>
    </div>
</div>

<script>
    (function(){
        // ========= 视频启动控制 =========
        const video = document.getElementById('introVideo');
        const gameContainer = document.getElementById('gameContainer');
        const skipBtn = document.getElementById('skipBtn');
        let gameStarted = false;
        
        function startGame() {
            if (gameStarted) return;
            gameStarted = true;
            
            video.style.transition = 'opacity 0.4s ease';
            video.style.opacity = '0';
            skipBtn.style.transition = 'opacity 0.3s ease';
            skipBtn.style.opacity = '0';
            
            setTimeout(() => {
                video.style.display = 'none';
                skipBtn.style.display = 'none';
                gameContainer.style.display = 'block';
            }, 400);
        }
        
        video.addEventListener('ended', startGame);
        skipBtn.addEventListener('click', startGame);
        
        // 视频加载失败时，5秒后自动进入
        video.addEventListener('error', function() {
            console.warn('视频加载失败，5秒后自动进入游戏');
            setTimeout(startGame, 5000);
        });
        
        // 后备：视频时长1分35秒 = 95秒，设置100秒强制进入（防止卡住）
        setTimeout(() => {
            if (!gameStarted) startGame();
        }, 100000);
        
        // ========= 世界配置 =========
        const MAP_W = 4200;
        const MAP_H = 3400;
        const PLAYER_RADIUS = 32;
        let player = { x: MAP_W/2, y: MAP_H/2, hp: 100, maxHp: 100, invincible: 0 };
        let enemies = [];
        let boss = null;
        let projectiles = [];
        let normalKills = 0;
        let bossDefeated = false;
        let gameActive = true;
        let hasKey = false;
        let door = { x: 0, y: 0 };
        let doorVisible = false;
        let currentDifficulty = "medium";
        let hunterSpeedBase = 2.2;
        
        let attackCd = 0;
        let ultCooldown = 0;
        const ULT_MAX_CD = 1800;
        
        let aimDir = { x: 1, y: 0 };
        let hitEffects = [];
        let slowMap = new Map();
        let markerPoint = { x: null, y: null };
        
        // 图片资源
        const mobImage = new Image();
        mobImage.crossOrigin = "Anonymous";
        mobImage.src = "https://t.tutu.to/img/LywgQ";
        let mobReady = false;
        mobImage.onload = () => mobReady = true;
        
        const bossImage = new Image();
        bossImage.crossOrigin = "Anonymous";
        bossImage.src = "https://t.tutu.to/img/Lyj86";
        let bossReady = false;
        bossImage.onload = () => bossReady = true;
        
        let canvas = document.getElementById('gameCanvas');
        let ctx = canvas.getContext('2d');
        let camera = { x: 0, y: 0 };
        
        let minimapCanvas = document.getElementById('minimapCanvas');
        let mmCtx = minimapCanvas.getContext('2d');
        let minimapWrap = document.getElementById('minimapWrapper');
        let trees = [];
        const TREE_COUNT = 95;
        
        const hpSpan = document.getElementById('hpValue');
        const killSpan = document.getElementById('mobKill');
        const keyStatusSpan = document.getElementById('keyStatus');
        const ultFill = document.getElementById('ultFill');
        const ultLabel = document.getElementById('ultLabel');
        
        // 移动系统
        let moveVec = { x: 0, y: 0 };
        let joystickActive = false;
        let useJoystick = true;
        let mouseDragActive = false;
        let dragTarget = { x: player.x, y: player.y };
        let joystickThumb = document.getElementById('joystickThumb');
        let joystickCenter = { x:0, y:0 };
        
        // ---------- 核心逻辑 ----------
        function updateUI(){
            hpSpan.innerText = player.hp;
            killSpan.innerText = normalKills;
            if(hasKey) keyStatusSpan.innerHTML = "🔑 钥匙: 已获得 (触碰光门逃生)";
            else keyStatusSpan.innerHTML = `🔑 钥匙: 未获得 (${normalKills}/20)`;
            let percent = (ultCooldown / ULT_MAX_CD) * 100;
            ultFill.style.width = (100 - percent) + "%";
            ultLabel.innerText = ultCooldown > 0 ? `⏳ 大招冷却 ${Math.ceil(ultCooldown/60)/10}s` : `✨ 大招就绪`;
        }
        
        function applySlow(enemy){
            if(slowMap.has(enemy)) slowMap.get(enemy).timer = 50;
            else {
                let original = enemy.speed;
                slowMap.set(enemy, { originalSpeed: original, timer: 50 });
                enemy.speed = original * 0.65;
            }
            hitEffects.push({ entity: enemy, timer: 28 });
        }
        
        function updateDebuffs(){
            for(let [en, data] of slowMap.entries()){
                if(!en || en.hp <= 0 || (en.type === "boss" && bossDefeated)) { slowMap.delete(en); continue; }
                data.timer--;
                if(data.timer <= 0){ en.speed = data.originalSpeed; slowMap.delete(en); }
            }
            for(let i=0;i<hitEffects.length;i++){ hitEffects[i].timer--; if(hitEffects[i].timer <= 0) hitEffects.splice(i,1), i--; }
        }
        
        function shootTowards(){
            if(!gameActive) return false;
            let closest = null, minDist = 700;
            if(boss && !bossDefeated){ let db = Math.hypot(boss.x - player.x, boss.y - player.y); if(db < minDist){ minDist = db; closest = boss; } }
            for(let e of enemies){ let d = Math.hypot(e.x - player.x, e.y - player.y); if(d < minDist){ minDist = d; closest = e; } }
            if(!closest) return false;
            projectiles.push({ x: player.x, y: player.y, target: closest, damage: 25, speed: 14 });
            return true;
        }
        
        function normalAttack(){ if(!gameActive || attackCd > 0) return; if(shootTowards()) attackCd = 18; }
        function castUltimate(){
            if(!gameActive || ultCooldown > 0) return;
            ultCooldown = ULT_MAX_CD; updateUI();
            for(let i=0;i<6;i++) setTimeout(()=>{ if(gameActive) shootTowards(); }, i*90);
        }
        
        function updateProjectiles(){
            for(let i=0;i<projectiles.length;i++){
                let p = projectiles[i];
                if(!p.target || p.target.hp <= 0 || (p.target.type==="boss" && bossDefeated)){ projectiles.splice(i,1); i--; continue; }
                let dx = p.target.x - p.x, dy = p.target.y - p.y, len = Math.hypot(dx,dy);
                if(len < 18){
                    p.target.hp -= p.damage; applySlow(p.target);
                    if(p.target.hp <= 0){
                        if(p.target.type === "mob"){ normalKills++; 
                            let idx = enemies.indexOf(p.target); if(idx !== -1) enemies.splice(idx,1);
                            if(normalKills >= 20 && !hasKey){
                                hasKey = true;
                                doorVisible = true;
                                let angle = Math.random() * Math.PI*2;
                                let rad = 900 + Math.random()*700;
                                door.x = player.x + Math.cos(angle)*rad;
                                door.y = player.y + Math.sin(angle)*rad;
                                door.x = Math.min(Math.max(door.x, 100), MAP_W-100);
                                door.y = Math.min(Math.max(door.y, 100), MAP_H-100);
                            }
                        }
                        else if(p.target.type === "boss"){ bossDefeated = true; boss = null; hasKey = true; doorVisible = true;
                            let angle = Math.random() * Math.PI*2;
                            let rad = 900 + Math.random()*700;
                            door.x = player.x + Math.cos(angle)*rad;
                            door.y = player.y + Math.sin(angle)*rad;
                            door.x = Math.min(Math.max(door.x, 100), MAP_W-100);
                            door.y = Math.min(Math.max(door.y, 100), MAP_H-100);
                        }
                        updateUI();
                    }
                    projectiles.splice(i,1); i--;
                } else { let step = Math.min(p.speed, len); p.x += (dx/len)*step; p.y += (dy/len)*step; }
            }
        }
        
        function updateEnemies(){
            for(let e of enemies){
                let dx = player.x - e.x, dy = player.y - e.y, len = Math.hypot(dx,dy);
                if(len > 1){ let mv = Math.min(e.speed, len-12); e.x += (dx/len)*mv; e.y += (dy/len)*mv; }
                e.x = Math.min(Math.max(e.x, e.radius), MAP_W - e.radius);
                e.y = Math.min(Math.max(e.y, e.radius), MAP_H - e.radius);
            }
            if(boss && !bossDefeated){
                let dx = player.x - boss.x, dy = player.y - boss.y, len = Math.hypot(dx,dy);
                if(len > 1){ let mv = Math.min(boss.speed, len-20); boss.x += (dx/len)*mv; boss.y += (dy/len)*mv; }
                boss.x = Math.min(Math.max(boss.x, boss.radius), MAP_W - boss.radius);
                boss.y = Math.min(Math.max(boss.y, boss.radius), MAP_H - boss.radius);
            }
        }
        
        function checkPlayerHurt(){
            if(player.invincible > 0){ player.invincible--; return; }
            for(let e of enemies){
                if(Math.hypot(player.x-e.x, player.y-e.y) < PLAYER_RADIUS + e.radius){ player.hp -= 12; player.invincible = 18; if(player.hp <= 0) gameOver(false); break; }
            }
            if(boss && !bossDefeated && Math.hypot(player.x-boss.x, player.y-boss.y) < PLAYER_RADIUS+boss.radius){ player.hp -= 24; player.invincible = 18; if(player.hp <= 0) gameOver(false); }
            updateUI();
        }
        
        function checkWinByDoor(){
            if(!gameActive) return;
            if(doorVisible && hasKey){
                let distToDoor = Math.hypot(player.x - door.x, player.y - door.y);
                if(distToDoor < PLAYER_RADIUS + 30){
                    gameActive = false;
                    alert("✨ 胜利！ 你触碰光门逃出神殿 ✨");
                    showLobby();
                }
            }
        }
        
        function gameOver(isWin){ gameActive = false; alert(isWin ? "✨ 胜利！ ✨" : "💀 被击败了 💀"); showLobby(); }
        function updateCooldowns(){ if(attackCd > 0) attackCd--; if(ultCooldown > 0){ ultCooldown--; updateUI(); } }
        
        function updatePlayerMove(){
            if(!gameActive) return;
            if(useJoystick && joystickActive && (Math.abs(moveVec.x)>0.1 || Math.abs(moveVec.y)>0.1)){
                let step = 6.8;
                player.x += moveVec.x * step; player.y += moveVec.y * step;
            } else if(mouseDragActive){
                let dx = dragTarget.x - player.x, dy = dragTarget.y - player.y, dist = Math.hypot(dx,dy);
                if(dist > 3){ let step = Math.min(7.0, dist); player.x += (dx/dist)*step; player.y += (dy/dist)*step; }
                else { player.x = dragTarget.x; player.y = dragTarget.y; }
            }
            player.x = Math.min(Math.max(player.x, PLAYER_RADIUS), MAP_W - PLAYER_RADIUS);
            player.y = Math.min(Math.max(player.y, PLAYER_RADIUS), MAP_H - PLAYER_RADIUS);
        }
        
        function updateCamera(){
            camera.x = player.x - canvas.width/2;
            camera.y = player.y - canvas.height/2;
            camera.x = Math.min(Math.max(camera.x, 0), MAP_W - canvas.width);
            camera.y = Math.min(Math.max(camera.y, 0), MAP_H - canvas.height);
        }
        
        function applyDifficulty(){
            if(currentDifficulty === "low") hunterSpeedBase = 1.48;
            else if(currentDifficulty === "medium") hunterSpeedBase = 2.3;
            else hunterSpeedBase = 3.5;
            for(let e of enemies) e.speed = e.originalSpeed = hunterSpeedBase * 0.96;
            if(boss) boss.speed = boss.originalSpeed = hunterSpeedBase * 1.28;
        }
        
        function resetGameSession(){
            player = { x: MAP_W/2, y: MAP_H/2, hp: 100, maxHp: 100, invincible: 0 };
            enemies = [];
            for(let i=0;i<20;i++){
                let angle = Math.random() * Math.PI*2, rad = 550 + Math.random()*600;
                let ex = player.x + Math.cos(angle)*rad, ey = player.y + Math.sin(angle)*rad;
                ex = Math.min(Math.max(ex, 70), MAP_W-70); ey = Math.min(Math.max(ey, 70), MAP_H-70);
                enemies.push({ x: ex, y: ey, hp: 100, maxHp:100, radius: 30, speed: hunterSpeedBase, originalSpeed: hunterSpeedBase, type: "mob" });
            }
            let bx = player.x + (Math.random()>0.5? 1100 : -1050), by = player.y + (Math.random()>0.5? 900 : -850);
            bx = Math.min(Math.max(bx, 180), MAP_W-180); by = Math.min(Math.max(by, 180), MAP_H-180);
            boss = { x: bx, y: by, hp: 10000, maxHp:10000, radius: 56, speed: hunterSpeedBase*1.28, originalSpeed: hunterSpeedBase*1.28, type: "boss" };
            bossDefeated = false; normalKills = 0; gameActive = true; hasKey = false; doorVisible = false; 
            projectiles = []; attackCd = 0; ultCooldown = 0; hitEffects = []; slowMap.clear(); markerPoint = { x: null, y: null };
            updateUI(); applyDifficulty();
        }
        
        function showLobby(){ document.getElementById('lobbyOverlay').style.display = 'flex'; gameActive = false; }
        function hideLobby(){ document.getElementById('lobbyOverlay').style.display = 'none'; resetGameSession(); }
        
        // 全图小地图绘制
        function drawFullMinimap(){
            const w = minimapCanvas.width, h = minimapCanvas.height;
            mmCtx.clearRect(0,0,w,h);
            mmCtx.fillStyle = '#2d4827';
            mmCtx.fillRect(0,0,w,h);
            let scaleX = w / MAP_W;
            let scaleY = h / MAP_H;
            let trans = (wx, wy) => ({ x: wx * scaleX, y: wy * scaleY });
            
            mmCtx.fillStyle = '#6aab5a';
            for(let t of trees){ let p = trans(t.x, t.y); if(p.x>=0 && p.x<=w && p.y>=0 && p.y<=h) mmCtx.fillRect(p.x-2, p.y-2, 4,4); }
            for(let e of enemies){ let p = trans(e.x, e.y); mmCtx.fillStyle = '#e3864a'; mmCtx.beginPath(); mmCtx.arc(p.x, p.y, 5, 0, Math.PI*2); mmCtx.fill(); mmCtx.fillStyle = '#fff7c0'; mmCtx.font='bold 10px monospace'; mmCtx.fillText("👾", p.x-4, p.y+3); }
            if(boss && !bossDefeated){ let p = trans(boss.x, boss.y); mmCtx.fillStyle = '#c05aa0'; mmCtx.beginPath(); mmCtx.arc(p.x, p.y, 9, 0, Math.PI*2); mmCtx.fill(); mmCtx.fillStyle = '#ffffff'; mmCtx.font='bold 12px monospace'; mmCtx.fillText("💀", p.x-6, p.y+5); }
            if(doorVisible && hasKey){ let p = trans(door.x, door.y); mmCtx.fillStyle = '#ffdd88'; mmCtx.beginPath(); mmCtx.arc(p.x, p.y, 8, 0, Math.PI*2); mmCtx.fill(); mmCtx.fillStyle = '#ffffff'; mmCtx.font='bold 12px monospace'; mmCtx.fillText("🚪", p.x-5, p.y+4); }
            if(markerPoint.x !== null && markerPoint.y !== null){
                let p = trans(markerPoint.x, markerPoint.y);
                mmCtx.fillStyle = '#66ccff'; mmCtx.beginPath(); mmCtx.arc(p.x, p.y, 6, 0, Math.PI*2); mmCtx.fill();
                mmCtx.fillStyle = 'white'; mmCtx.font='bold 12px monospace'; mmCtx.fillText("📍", p.x-5, p.y+4);
                let playerPix = trans(player.x, player.y);
                mmCtx.beginPath(); mmCtx.moveTo(playerPix.x, playerPix.y); mmCtx.lineTo(p.x, p.y);
                mmCtx.strokeStyle = '#66ff99'; mmCtx.lineWidth = 2; mmCtx.setLineDash([5,5]); mmCtx.stroke(); mmCtx.setLineDash([]);
            }
            let pp = trans(player.x, player.y);
            mmCtx.fillStyle = '#55ff77';
            mmCtx.beginPath(); mmCtx.moveTo(pp.x, pp.y-8); mmCtx.lineTo(pp.x-6, pp.y+4); mmCtx.lineTo(pp.x+6, pp.y+4); mmCtx.fill();
            let tl = trans(camera.x, camera.y), br = trans(camera.x+canvas.width, camera.y+canvas.height);
            mmCtx.strokeStyle = '#ffdd99'; mmCtx.lineWidth = 1.8; mmCtx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
        }
        
        function onMinimapClick(e){
            const rect = minimapCanvas.getBoundingClientRect();
            const scaleX = minimapCanvas.width / rect.width;
            const scaleY = minimapCanvas.height / rect.height;
            let clientX, clientY;
            if(e.touches){ clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
            else { clientX = e.clientX; clientY = e.clientY; }
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            let worldX = canvasX / (minimapCanvas.width / MAP_W);
            let worldY = canvasY / (minimapCanvas.height / MAP_H);
            worldX = Math.min(Math.max(worldX, 0), MAP_W); worldY = Math.min(Math.max(worldY, 0), MAP_H);
            markerPoint = { x: worldX, y: worldY };
            drawFullMinimap();
            e.stopPropagation();
        }
        
        function toggleMinimap(){ minimapWrap.classList.toggle('full'); drawFullMinimap(); }
        
        function initJoystick(){
            let container = document.getElementById('joystickContainer');
            let thumb = joystickThumb;
            let active = false;
            container.addEventListener('touchstart', (e)=>{
                e.preventDefault();
                let rect = container.getBoundingClientRect();
                joystickCenter.x = rect.left + rect.width/2;
                joystickCenter.y = rect.top + rect.height/2;
                active = true; joystickActive = true; useJoystick = true; moveVec = { x:0, y:0 };
                thumb.style.transform = `translate(-50%, -50%)`;
            });
            window.addEventListener('touchmove', (e)=>{
                if(!active) return;
                let touch = e.touches[0];
                let dx = touch.clientX - joystickCenter.x;
                let dy = touch.clientY - joystickCenter.y;
                let len = Math.hypot(dx,dy);
                let maxR = 45;
                if(len > maxR){ dx = dx/len*maxR; dy = dy/len*maxR; }
                moveVec.x = dx / 35; moveVec.y = dy / 35;
                if(Math.abs(moveVec.x)>1) moveVec.x = moveVec.x/Math.abs(moveVec.x);
                if(Math.abs(moveVec.y)>1) moveVec.y = moveVec.y/Math.abs(moveVec.y);
                thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                e.preventDefault();
            });
            window.addEventListener('touchend', ()=>{ active = false; joystickActive = false; moveVec = { x:0, y:0 }; thumb.style.transform = `translate(-50%, -50%)`; });
        }
        
        function getCanvasCoord(e){
            let rect = canvas.getBoundingClientRect();
            let sx = canvas.width/rect.width, sy = canvas.height/rect.height;
            let cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            let cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            return { x: (cx - rect.left)*sx, y: (cy - rect.top)*sy };
        }
        function onDragStart(e){ let coord = getCanvasCoord(e); dragTarget = { x: coord.x + camera.x, y: coord.y + camera.y }; mouseDragActive = true; useJoystick = false; }
        function onDragMove(e){ if(!mouseDragActive) return; let coord = getCanvasCoord(e); dragTarget = { x: coord.x + camera.x, y: coord.y + camera.y }; }
        function onDragEnd(){ mouseDragActive = false; }
        function onMouseMove(e){
            let coord = getCanvasCoord(e);
            let worldX = coord.x + camera.x, worldY = coord.y + camera.y;
            let dx = worldX - player.x, dy = worldY - player.y, len = Math.hypot(dx,dy);
            if(len > 0.01){ aimDir.x = dx/len; aimDir.y = dy/len; }
        }
        
        function drawBackground(){
            ctx.fillStyle = '#346b34'; ctx.fillRect(0,0,canvas.width,canvas.height);
            for(let t of trees){
                let sx = t.x - camera.x, sy = t.y - camera.y;
                if(sx > -80 && sx < canvas.width+80){
                    ctx.fillStyle = '#5c8c44'; ctx.fillRect(sx-10, sy-15, 20, 30);
                    ctx.fillStyle = '#47632c'; ctx.beginPath(); ctx.arc(sx, sy-18, 14, 0, Math.PI*2); ctx.fill();
                }
            }
            if(doorVisible && hasKey){
                let sx = door.x - camera.x, sy = door.y - camera.y;
                if(sx > -60 && sx < canvas.width+60){
                    ctx.fillStyle = '#ffdd99'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(sx, sy, 28, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#ffaa55'; ctx.font='bold 28px monospace'; ctx.fillText("🚪", sx-15, sy+12); ctx.shadowBlur=0;
                }
            }
        }
        function drawEnemies(){
            for(let e of enemies){
                let sx = e.x - camera.x, sy = e.y - camera.y;
                if(mobReady) ctx.drawImage(mobImage, sx-28, sy-28, 56,56);
                else{ ctx.fillStyle='#b33e3e'; ctx.beginPath(); ctx.arc(sx,sy,26,0,Math.PI*2); ctx.fill(); }
                ctx.fillStyle='#fff2b0'; ctx.font='bold 16px monospace'; ctx.fillText(`❤️ ${e.hp}`, sx-22, sy-34);
                if(hitEffects.some(h=>h.entity===e)) ctx.fillText("😍", sx-18, sy-52);
            }
            if(boss && !bossDefeated){
                let sx = boss.x - camera.x, sy = boss.y - camera.y;
                if(bossReady) ctx.drawImage(bossImage, sx-48, sy-48, 96,96);
                else{ ctx.fillStyle='#8f2f6f'; ctx.beginPath(); ctx.arc(sx,sy,44,0,Math.PI*2); ctx.fill(); }
                ctx.fillStyle='#ffbc6e'; ctx.font='bold 22px monospace'; ctx.fillText(`💀 ${boss.hp}`, sx-50, sy-62);
                if(hitEffects.some(h=>h.entity===boss)) ctx.fillText("😍", sx-28, sy-78);
            }
        }
        function drawProjectiles(){ for(let p of projectiles){ let sx = p.x - camera.x, sy = p.y - camera.y; ctx.fillStyle='#ffec80'; ctx.font='bold 24px "KaiTi"'; ctx.fillText("桂英", sx-18, sy-8); } }
        function drawPlayer(){
            let sx = player.x - camera.x, sy = player.y - camera.y;
            ctx.font = '52px "Segoe UI Emoji"'; ctx.fillStyle = '#ffffb0'; ctx.fillText("🙂", sx-24, sy+16);
            let arrowX = sx + aimDir.x * 45, arrowY = sy + aimDir.y * 45;
            ctx.beginPath(); ctx.moveTo(arrowX, arrowY); ctx.lineTo(arrowX-8, arrowY-5); ctx.lineTo(arrowX-8, arrowY+5);
            ctx.fillStyle = '#ffdd77'; ctx.fill();
            let percent = player.hp/player.maxHp;
            ctx.fillStyle = '#aa2222'; ctx.fillRect(sx-30, sy-42, 60, 8);
            ctx.fillStyle = '#44ff44'; ctx.fillRect(sx-30, sy-42, 60*percent, 8);
        }
        function drawAll(){ drawBackground(); drawEnemies(); drawProjectiles(); drawPlayer(); drawFullMinimap(); }
        
        function resizeCanvas(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; drawAll(); }
        
        function gameUpdate(){
            if(gameActive){
                updateEnemies(); updateProjectiles(); checkPlayerHurt(); updateCooldowns();
                updatePlayerMove(); updateDebuffs(); updateCamera(); checkWinByDoor();
                drawAll();
            } else drawAll();
            requestAnimationFrame(gameUpdate);
        }
        
        for(let i=0;i<TREE_COUNT;i++) trees.push({ x: 80+Math.random()*(MAP_W-160), y: 80+Math.random()*(MAP_H-160) });
        
        window.addEventListener('resize', ()=>{ resizeCanvas(); drawFullMinimap(); });
        document.getElementById('attackBtn').addEventListener('click', ()=>normalAttack());
        document.getElementById('ultraBtn').addEventListener('click', ()=>castUltimate());
        minimapWrap.addEventListener('click', (e)=>{ if(e.target === minimapCanvas || e.target.closest('#minimapCanvas')) onMinimapClick(e); else toggleMinimap(); });
        window.addEventListener('keydown', (e)=>{
            if(e.key === 'm' || e.key === 'M') toggleMinimap();
            if(e.key === 'e' || e.key === 'E'){ e.preventDefault(); normalAttack(); }
            if(e.key === 'q' || e.key === 'Q'){ e.preventDefault(); castUltimate(); }
        });
        canvas.addEventListener('mousemove', onMouseMove);
        canvas.addEventListener('mousedown', onDragStart);
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
        canvas.addEventListener('touchstart', (e)=>{ onMouseMove(e.touches[0]); onDragStart(e); });
        
        initJoystick(); resizeCanvas(); showLobby();
        document.getElementById('startGameBtn').onclick = ()=>{ hideLobby(); };
        document.getElementById('exitGameBtn').onclick = ()=>{ if(confirm("退出游戏？")) window.close?.(); alert("手动关闭页面"); };
        document.querySelectorAll('.diff-btn').forEach(btn=>{
            btn.onclick = ()=>{
                document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
                btn.classList.add('active');
                if(btn.dataset.diff === "low") currentDifficulty = "low";
                else if(btn.dataset.diff === "medium") currentDifficulty = "medium";
                else currentDifficulty = "high";
                if(!document.getElementById('lobbyOverlay').style.display.includes('flex')) applyDifficulty();
            };
        });
        gameUpdate();
    })();
</script>
</body>
</html>
