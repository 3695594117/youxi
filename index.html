<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>大逃杀 · 暗影追击 · 难度自选</title>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #0a2f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', 'Microsoft Yahei', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* 全屏画布容器 */
        .game-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1e3a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #3c6b3a;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* 迷你地图悬浮 (右上角) */
        .minimap-container {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 180px;
            height: 180px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 2px solid #ffd966;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            overflow: hidden;
            z-index: 30;
            transition: 0.2s;
        }
        .minimap-header {
            background: #ffd966cc;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #1e3a1a;
            cursor: move;
        }
        .zoom-controls {
            display: flex;
            gap: 10px;
        }
        .zoom-btn {
            background: #2c2c1c;
            border: none;
            color: #ffdd99;
            width: 22px;
            height: 22px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            line-height: 1;
            padding: 0;
            box-shadow: none;
        }
        canvas.minimap-canvas {
            width: 100%;
            height: calc(100% - 32px);
            background: #2d4827;
            display: block;
        }
        .marker-badge {
            position: absolute;
            bottom: 6px;
            left: 6px;
            background: #000000aa;
            border-radius: 20px;
            padding: 2px 8px;
            font-size: 10px;
            color: #ffdd88;
            pointer-events: none;
        }

        /* 大厅主菜单浮层 */
        .menu-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            transition: 0.2s;
        }
        .menu-card {
            background: #1e2b1c;
            border-radius: 64px;
            padding: 40px 32px;
            text-align: center;
            width: 320px;
            border: 3px solid #ffd966;
            box-shadow: 0 20px 35px black;
        }
        .game-title {
            font-size: 40px;
            font-weight: 800;
            color: #ffd966;
            margin-bottom: 30px;
            letter-spacing: 4px;
        }
        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }
        .menu-btn {
            background: #d4a017;
            border: none;
            font-size: 1.4rem;
            font-weight: bold;
            padding: 12px 0;
            border-radius: 60px;
            color: #2c2c1c;
            cursor: pointer;
            transition: 0.08s linear;
            box-shadow: 0 4px 0 #6b3c00;
        }
        .menu-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #6b3c00;
        }
        .difficulty-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }
        .difficulty-btn {
            background: #3a4a2a;
            border: 1px solid #ffd966;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            color: #f5e2b0;
            cursor: pointer;
            transition: 0.05s linear;
        }
        .difficulty-btn.active {
            background: #ffd966;
            color: #1f3a1a;
            border-color: white;
            box-shadow: 0 0 8px gold;
        }
        .exit-btn {
            background: #6a2e2e;
            color: #ffc6a0;
            box-shadow: 0 4px 0 #3e1a1a;
        }

        /* 结算界面 (胜利/失败) */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 150;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s ease;
        }
        .overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .result-card {
            background: #1e2b1c;
            border-radius: 48px;
            padding: 32px 28px;
            text-align: center;
            width: 280px;
            border: 2px solid #ffd966;
        }
        .result-emoji {
            font-size: 72px;
            margin-bottom: 12px;
        }
        .result-title {
            font-size: 28px;
            font-weight: bold;
            color: #ffd966;
            margin-bottom: 20px;
        }
        .result-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        .result-buttons button {
            background: #ffc857;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .minimap-container { width: 130px; height: 130px; top: 12px; right: 12px; }
            .menu-card { width: 85%; padding: 28px 20px; }
            .game-title { font-size: 32px; }
            .menu-btn { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<!-- 全屏游戏画布 -->
<div class="game-fullscreen">
    <canvas id="gameCanvas" width="1200" height="800"></canvas>
</div>

<!-- 迷你地图 -->
<div class="minimap-container" id="minimapWrap">
    <div class="minimap-header">
        🗺️ 森林雷达
        <div class="zoom-controls">
            <button class="zoom-btn" id="zoomInBtn">+</button>
            <button class="zoom-btn" id="zoomOutBtn">-</button>
        </div>
    </div>
    <canvas id="minimapCanvas" width="300" height="300" style="width:100%; height:calc(100% - 32px);"></canvas>
    <div class="marker-badge">📍 绿=玩家 | 🔴=追杀者 | 🚪=门</div>
</div>

<!-- 大厅界面 -->
<div id="lobbyOverlay" class="menu-overlay">
    <div class="menu-card">
        <div class="game-title">🔪 大逃杀 🔪</div>
        <div class="menu-buttons">
            <button id="startGameBtn" class="menu-btn">⚔️ 开始游戏 ⚔️</button>
            <button id="exitGameBtn" class="menu-btn exit-btn">🚪 退出游戏</button>
        </div>
        <div style="margin-top: 8px; color:#ffdfaa; font-size:14px;">选择难度</div>
        <div class="difficulty-row">
            <button data-diff="low" class="difficulty-btn active">🐾 低</button>
            <button data-diff="medium" class="difficulty-btn">⚡ 中</button>
            <button data-diff="high" class="difficulty-btn">🔥 高</button>
        </div>
        <p style="font-size: 12px; margin-top: 20px; color:#aacc88;">👆 手指/鼠标拖拽移动 | 追杀者会飞速逼近</p>
    </div>
</div>

<!-- 结算界面 -->
<div id="resultOverlay" class="overlay">
    <div class="result-card">
        <div class="result-emoji" id="resultEmoji">😍</div>
        <div class="result-title" id="resultTitle">胜利！</div>
        <p style="color:#ffe0a3;">你逃出了噩梦森林</p>
        <div class="result-buttons">
            <button id="rematchBtn">🔁 再来一局</button>
            <button id="toLobbyBtn">🏠 回大厅</button>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- 世界参数 ----------
        const MAP_W = 2800;
        const MAP_H = 2200;
        const PLAYER_RADIUS = 26;
        const HUNTER_RADIUS = 34;
        const DOOR_RADIUS = 28;
        const TREE_COUNT = 85;
        
        // 游戏动态
        let gameActive = false;        // 游戏中
        let gameWinFlag = false;
        let difficulty = "medium";     // low / medium / high
        let hunterSpeed = 2.2;         // 中等默认
        
        let playerPos = { x: MAP_W/2, y: MAP_H/2 };
        let hunterPos = { x: MAP_W/2 - 380, y: MAP_H/2 - 280 };
        let doorPos = { x: 0, y: 0 };
        let trees = [];
        
        // 摄像头偏移 (拖拽查看)
        let camera = { x: 0, y: 0 };
        let isDraggingView = false;
        let dragStart = { x: 0, y: 0 };
        let camStart = { x: 0, y: 0 };
        
        // 移动控制
        let isMoving = false;
        let moveTarget = { x: playerPos.x, y: playerPos.y };
        
        // DOM 元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const mmCtx = minimapCanvas.getContext('2d');
        let minimapZoom = 1.0;
        const ZOOM_MIN = 0.6, ZOOM_MAX = 2.5;
        
        // 追杀者图片
        const hunterImg = new Image();
        hunterImg.crossOrigin = "Anonymous";
        hunterImg.src = "https://t.tutu.to/img/LywgQ";
        let hunterImageReady = false;
        hunterImg.onload = () => { hunterImageReady = true; };
        
        // ---------- 难度速度调整 ----------
        function applyDifficultySpeed() {
            if(difficulty === "low") hunterSpeed = 1.45;
            else if(difficulty === "medium") hunterSpeed = 2.25;
            else hunterSpeed = 3.35;   // 高难度 非常快
        }
        
        // ---------- 随机生成门 (保证远离玩家/追杀者) ----------
        function generateRandomDoor() {
            let safe = false;
            let attempts = 0;
            while(!safe && attempts < 80) {
                let randX = 220 + Math.random() * (MAP_W - 440);
                let randY = 180 + Math.random() * (MAP_H - 360);
                const distToPlayer = Math.hypot(randX - playerPos.x, randY - playerPos.y);
                const distToHunter = Math.hypot(randX - hunterPos.x, randY - hunterPos.y);
                if(distToPlayer > 550 && distToHunter > 450) {
                    doorPos = { x: randX, y: randY };
                    safe = true;
                    break;
                }
                attempts++;
            }
            if(!safe) doorPos = { x: MAP_W - 500, y: MAP_H - 400 };
        }
        
        // 生成树木
        function generateTrees() {
            trees = [];
            for(let i=0; i<TREE_COUNT; i++) {
                let tree = { x: 80 + Math.random() * (MAP_W - 160), y: 80 + Math.random() * (MAP_H - 160) };
                let conflict = false;
                if(Math.hypot(tree.x - playerPos.x, tree.y - playerPos.y) < 85) conflict = true;
                if(Math.hypot(tree.x - hunterPos.x, tree.y - hunterPos.y) < 100) conflict = true;
                if(Math.hypot(tree.x - doorPos.x, tree.y - doorPos.y) < 90) conflict = true;
                if(conflict) { i--; continue; }
                trees.push(tree);
            }
        }
        
        // 完整重置对局 (保留难度，重新布局)
        function resetGameSession() {
            // 玩家与追杀者出生点不对称
            playerPos = { x: MAP_W/2 + 150 + (Math.random() * 100), y: MAP_H/2 + 80 };
            hunterPos = { x: MAP_W/2 - 280 - (Math.random() * 120), y: MAP_H/2 - 200 };
            moveTarget = { x: playerPos.x, y: playerPos.y };
            gameActive = true;
            gameWinFlag = false;
            generateRandomDoor();      // 随机门的位置
            generateTrees();           // 新树木
            applyDifficultySpeed();
            // 重置相机位置（跟随玩家）
            camera.x = playerPos.x - canvas.width/2;
            camera.y = playerPos.y - canvas.height/2;
            camera.x = Math.min(Math.max(camera.x, 0), MAP_W - canvas.width);
            camera.y = Math.min(Math.max(camera.y, 0), MAP_H - canvas.height);
            draw();
            updateMiniMap();
        }
        
        // 完全初始化大厅->开始游戏
        function startNewGame() {
            resetGameSession();
            document.getElementById('lobbyOverlay').style.display = 'none';
        }
        
        // 返回大厅
        function backToLobby() {
            gameActive = false;
            gameWinFlag = false;
            document.getElementById('lobbyOverlay').style.display = 'flex';
            document.getElementById('resultOverlay').classList.remove('active');
        }
        
        // 游戏失败/胜利展示
        function showGameResult(isWin) {
            if(!gameActive) return;
            gameActive = false;
            gameWinFlag = isWin;
            const overlay = document.getElementById('resultOverlay');
            const emojiSpan = document.getElementById('resultEmoji');
            const titleSpan = document.getElementById('resultTitle');
            if(isWin) {
                emojiSpan.innerText = "😍";
                titleSpan.innerText = "胜利大逃亡!";
            } else {
                emojiSpan.innerText = "😱";
                titleSpan.innerText = "被追杀者捕获...";
            }
            overlay.classList.add('active');
        }
        
        // 更新追杀者AI (根据难度动态移动)
        function updateHunterAI() {
            if(!gameActive) return;
            const dx = playerPos.x - hunterPos.x;
            const dy = playerPos.y - hunterPos.y;
            const len = Math.hypot(dx, dy);
            if(len > 0.5) {
                let step = Math.min(hunterSpeed, len - 12);
                if(step > 0.3) {
                    hunterPos.x += (dx / len) * step;
                    hunterPos.y += (dy / len) * step;
                }
            }
            // 边界限制
            hunterPos.x = Math.min(Math.max(hunterPos.x, HUNTER_RADIUS), MAP_W - HUNTER_RADIUS);
            hunterPos.y = Math.min(Math.max(hunterPos.y, HUNTER_RADIUS), MAP_H - HUNTER_RADIUS);
        }
        
        // 玩家移动平滑
        function updatePlayerMovement() {
            if(!gameActive) return;
            const dx = moveTarget.x - playerPos.x;
            const dy = moveTarget.y - playerPos.y;
            const dist = Math.hypot(dx, dy);
            let step = 6.8;
            if(dist < step) {
                playerPos.x = moveTarget.x;
                playerPos.y = moveTarget.y;
            } else {
                playerPos.x += (dx / dist) * step;
                playerPos.y += (dy / dist) * step;
            }
            playerPos.x = Math.min(Math.max(playerPos.x, PLAYER_RADIUS), MAP_W - PLAYER_RADIUS);
            playerPos.y = Math.min(Math.max(playerPos.y, PLAYER_RADIUS), MAP_H - PLAYER_RADIUS);
            moveTarget.x = Math.min(Math.max(moveTarget.x, PLAYER_RADIUS), MAP_W - PLAYER_RADIUS);
            moveTarget.y = Math.min(Math.max(moveTarget.y, PLAYER_RADIUS), MAP_H - PLAYER_RADIUS);
        }
        
        // 碰撞/胜利判定
        function checkGameCollisions() {
            if(!gameActive) return;
            // 门胜利
            const distToDoor = Math.hypot(playerPos.x - doorPos.x, playerPos.y - doorPos.y);
            if(distToDoor < PLAYER_RADIUS + DOOR_RADIUS) {
                showGameResult(true);
                return;
            }
            // 追杀者失败
            const distToHunter = Math.hypot(playerPos.x - hunterPos.x, playerPos.y - hunterPos.y);
            if(distToHunter < PLAYER_RADIUS + HUNTER_RADIUS) {
                showGameResult(false);
            }
        }
        
        // 相机平滑跟随/拖拽逻辑
        function updateCamera() {
            if(!isDraggingView && gameActive) {
                let targetX = playerPos.x - canvas.width/2;
                let targetY = playerPos.y - canvas.height/2;
                targetX = Math.min(Math.max(targetX, 0), MAP_W - canvas.width);
                targetY = Math.min(Math.max(targetY, 0), MAP_H - canvas.height);
                camera.x += (targetX - camera.x) * 0.12;
                camera.y += (targetY - camera.y) * 0.12;
            } else if(!gameActive && !isDraggingView) {
                // 空闲时摄像头无强制跟随
            }
            camera.x = Math.min(Math.max(camera.x, 0), MAP_W - canvas.width);
            camera.y = Math.min(Math.max(camera.y, 0), MAP_H - canvas.height);
        }
        
        // ---------- 绘图模块 (无红眼特效, 门中央提示) ----------
        function drawBackground() {
            ctx.fillStyle = '#4d8047';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            // 网格氛围
            ctx.strokeStyle = '#aacf9e55';
            ctx.lineWidth = 1;
            for(let i=0;i<MAP_W;i+=240){
                ctx.beginPath();
                ctx.moveTo(i-camera.x,0); ctx.lineTo(i-camera.x,canvas.height);
                ctx.stroke();
                ctx.moveTo(0,i-camera.y); ctx.lineTo(canvas.width,i-camera.y);
                ctx.stroke();
            }
        }
        
        function drawTrees() {
            for(let t of trees) {
                let x = t.x - camera.x;
                let y = t.y - camera.y;
                if(x > -60 && x < canvas.width+60 && y > -60 && y < canvas.height+60) {
                    ctx.fillStyle = '#5e8c4a';
                    ctx.fillRect(x-9, y-12, 18, 26);
                    ctx.fillStyle = '#7c5e3c';
                    ctx.fillRect(x-5, y-4, 10, 18);
                    ctx.fillStyle = '#2e7d32';
                    ctx.beginPath();
                    ctx.arc(x, y-14, 14, 0, Math.PI*2);
                    ctx.fill();
                }
            }
        }
        
        function drawDoor() {
            let x = doorPos.x - camera.x;
            let y = doorPos.y - camera.y;
            if(x > -80 && x < canvas.width+80 && y > -80 && y < canvas.height+80) {
                ctx.fillStyle = '#b87c4a';
                ctx.fillRect(x-16, y-28, 32, 56);
                ctx.fillStyle = '#f3bc5c';
                ctx.fillRect(x-6, y-12, 12, 24);
                ctx.font = "bold 32px 'Segoe UI'";
                ctx.fillStyle = "#ffec9f";
                ctx.shadowBlur = 6;
                ctx.fillText("🚪", x-18, y+6);
                // 中央加发光提示
                ctx.font = "bold 14px system-ui";
                ctx.fillStyle = "#fde16d";
                ctx.shadowBlur = 2;
                ctx.fillText("逃离之门", x-26, y-20);
            }
        }
        
        function drawHunter() {
            let x = hunterPos.x - camera.x;
            let y = hunterPos.y - camera.y;
            if(x > -70 && x < canvas.width+70 && y > -70 && y < canvas.height+70) {
                if(hunterImageReady && hunterImg.complete) {
                    ctx.drawImage(hunterImg, x-34, y-34, 68, 68);
                } else {
                    ctx.fillStyle = "#872e2e";
                    ctx.beginPath();
                    ctx.arc(x, y, 28, 0, Math.PI*2);
                    ctx.fill();
                    ctx.fillStyle = "#ffaa66";
                    ctx.font = "34px monospace";
                    ctx.fillText("👹", x-18, y+12);
                }
                // 红眼特效已删除
            }
        }
        
        function drawPlayer() {
            let x = playerPos.x - camera.x;
            let y = playerPos.y - camera.y;
            const distToHunter = Math.hypot(playerPos.x - hunterPos.x, playerPos.y - hunterPos.y);
            let emoji = "🙂";
            if(distToHunter < 120) emoji = "😱";
            else if(distToHunter < 230) emoji = "😨";
            else emoji = "🙂";
            ctx.font = `52px "Segoe UI Emoji"`;
            ctx.fillStyle = "#fff5cf";
            ctx.fillText(emoji, x-26, y+22);
            ctx.font = "bold 20px system-ui";
            ctx.fillStyle = "#fcffb3";
            ctx.fillText("⚔️", x-8, y-14);
        }
        
        // 全屏自适应画布尺寸
        function resizeCanvas() {
            const container = document.querySelector('.game-fullscreen');
            const w = container.clientWidth;
            const h = container.clientHeight;
            canvas.width = Math.max(900, w);
            canvas.height = Math.max(600, h);
            draw();
            updateMiniMap();
        }
        
        // ---------- 迷你地图 (缩放+标记) ----------
        function updateMiniMap() {
            const w = minimapCanvas.width, h = minimapCanvas.height;
            mmCtx.clearRect(0, 0, w, h);
            mmCtx.fillStyle = '#2d4827';
            mmCtx.fillRect(0, 0, w, h);
            const zoom = minimapZoom;
            const centerX = w/2, centerY = h/2;
            const worldToMap = (wx, wy) => {
                let rx = (wx - MAP_W/2) * zoom + centerX;
                let ry = (wy - MAP_H/2) * zoom + centerY;
                return {x: rx, y: ry};
            };
            // 树木
            mmCtx.fillStyle = '#86bf6c';
            for(let t of trees) {
                let p = worldToMap(t.x, t.y);
                if(p.x>0 && p.x<w && p.y>0 && p.y<h) mmCtx.fillRect(p.x-2, p.y-2, 4, 4);
            }
            // 门
            let doorP = worldToMap(doorPos.x, doorPos.y);
            mmCtx.font = "16px 'Segoe UI'";
            mmCtx.fillStyle = '#f5bc70';
            mmCtx.fillText("🚪", doorP.x-8, doorP.y-6);
            // 追杀者红点
            let hunterP = worldToMap(hunterPos.x, hunterPos.y);
            mmCtx.beginPath();
            mmCtx.fillStyle = '#ff4444';
            mmCtx.arc(hunterP.x, hunterP.y, 7, 0, Math.PI*2);
            mmCtx.fill();
            mmCtx.fillStyle = 'white';
            mmCtx.font = "bold 14px monospace";
            mmCtx.fillText("👹", hunterP.x-7, hunterP.y+6);
            // 玩家绿点
            let playerP = worldToMap(playerPos.x, playerPos.y);
            mmCtx.beginPath();
            mmCtx.fillStyle = '#66ff66';
            mmCtx.arc(playerP.x, playerP.y, 8, 0, Math.PI*2);
            mmCtx.fill();
            mmCtx.fillStyle = '#004400';
            mmCtx.font = "bold 12px monospace";
            mmCtx.fillText("🙂", playerP.x-5, playerP.y+5);
            // 视野框
            let tl = worldToMap(camera.x, camera.y);
            let br = worldToMap(camera.x+canvas.width, camera.y+canvas.height);
            mmCtx.strokeStyle = '#ffd966';
            mmCtx.lineWidth = 2;
            mmCtx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);
        }
        
        // 主绘制
        function draw() {
            if(!ctx) return;
            drawBackground();
            drawTrees();
            drawDoor();
            drawHunter();
            drawPlayer();
        }
        
        // 游戏循环
        function gameLoop() {
            if(gameActive) {
                updatePlayerMovement();
                updateHunterAI();
                checkGameCollisions();
                updateCamera();
                draw();
                updateMiniMap();
            } else {
                if(!gameActive && document.getElementById('lobbyOverlay').style.display !== 'flex') {
                    draw();
                    updateMiniMap();
                } else {
                    if(document.getElementById('lobbyOverlay').style.display === 'flex') {
                        // 大厅静止状态无需刷新频繁
                    }
                }
            }
            requestAnimationFrame(gameLoop);
        }
        
        // ---- 事件监听 (移动拖拽) ----
        function getCanvasCoord(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let cx, cy;
            if(e.touches) {
                cx = e.touches[0].clientX;
                cy = e.touches[0].clientY;
            } else {
                cx = e.clientX;
                cy = e.clientY;
            }
            let canvasX = (cx - rect.left) * scaleX;
            let canvasY = (cy - rect.top) * scaleY;
            return { x: Math.min(Math.max(canvasX,0), canvas.width), y: Math.min(Math.max(canvasY,0), canvas.height) };
        }
        
        function onPointerDown(e) {
            e.preventDefault();
            if(!gameActive) return;
            const coord = getCanvasCoord(e);
            const worldX = coord.x + camera.x;
            const worldY = coord.y + camera.y;
            if(worldX > 0 && worldY > 0) {
                isMoving = true;
                moveTarget = { x: worldX, y: worldY };
            }
            isDraggingView = true;
            dragStart.x = e.clientX || (e.touches ? e.touches[0].clientX : 0);
            dragStart.y = e.clientY || (e.touches ? e.touches[0].clientY : 0);
            camStart.x = camera.x;
            camStart.y = camera.y;
        }
        
        function onPointerMove(e) {
            if(!gameActive) return;
            if(isDraggingView) {
                let cx = e.clientX || (e.touches ? e.touches[0].clientX : 0);
                let cy = e.clientY || (e.touches ? e.touches[0].clientY : 0);
                let dx = (dragStart.x - cx) * 1.2;
                let dy = (dragStart.y - cy) * 1.2;
                let newX = camStart.x + dx;
                let newY = camStart.y + dy;
                camera.x = Math.min(Math.max(newX, 0), MAP_W - canvas.width);
                camera.y = Math.min(Math.max(newY, 0), MAP_H - canvas.height);
                draw();
                updateMiniMap();
            }
            if(isMoving && gameActive) {
                const coord = getCanvasCoord(e);
                const worldX = coord.x + camera.x;
                const worldY = coord.y + camera.y;
                moveTarget = { x: worldX, y: worldY };
            }
        }
        
        function onPointerUp() {
            isMoving = false;
            isDraggingView = false;
        }
        
        // 注册事件
        canvas.addEventListener('mousedown', onPointerDown);
        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('touchstart', onPointerDown, {passive:false});
        window.addEventListener('touchmove', onPointerMove, {passive:false});
        window.addEventListener('touchend', onPointerUp);
        window.addEventListener('resize', () => { resizeCanvas(); updateMiniMap(); });
        
        // ---------- UI 交互 ----------
        document.getElementById('startGameBtn').addEventListener('click', () => {
            startNewGame();
        });
        document.getElementById('exitGameBtn').addEventListener('click', () => {
            if(confirm("退出游戏？")) {
                window.close?.();
                alert("请手动关闭页面");
            }
        });
        document.getElementById('rematchBtn').addEventListener('click', () => {
            document.getElementById('resultOverlay').classList.remove('active');
            resetGameSession();
            gameActive = true;
        });
        document.getElementById('toLobbyBtn').addEventListener('click', () => {
            document.getElementById('resultOverlay').classList.remove('active');
            backToLobby();
        });
        // 难度切换
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if(btn.dataset.diff === "low") difficulty = "low";
                else if(btn.dataset.diff === "medium") difficulty = "medium";
                else difficulty = "high";
                applyDifficultySpeed();
            });
        });
        // 小地图缩放
        document.getElementById('zoomInBtn').addEventListener('click', () => {
            minimapZoom = Math.min(ZOOM_MAX, minimapZoom + 0.2);
            updateMiniMap();
        });
        document.getElementById('zoomOutBtn').addEventListener('click', () => {
            minimapZoom = Math.max(ZOOM_MIN, minimapZoom - 0.2);
            updateMiniMap();
        });
        
        resizeCanvas();
        backToLobby();    // 初始显示大厅
        gameLoop();
    })();
</script>
</body>
</html>
